# docker compose exec web odoo scaffold openacademy1 /mnt/extra-addons
# docker exec -it odoo-container odoo scaffold openacademy2 /mnt/extra-addons
# docker exec -it odoo-container bash -c "odoo scaffold openacademy3 /mnt/extra-addons"
version: '3.1'
services:
  web:
    container_name: odoo-container
    # image: odoo:16.0
    image: odoo:17.0
    env_file: .env
    depends_on:
      - psql
    ports:
      - "8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
  # pgadmin:
  #   container_name: pgadmin-container
  #   image: dpage/pgadmin4:latest
  #   env_file: .env
  #   depends_on:
  #     - psql
  #   ports:
  #     - "8080:80"
  #   volumes:
  #     - pgadmin-data:/var/lib/pgadmin
  psql:
    container_name: postgres-container
    image: postgres:13
    env_file: .env
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  odoo-data:
  # pgadmin-data:
  postgres-data:
